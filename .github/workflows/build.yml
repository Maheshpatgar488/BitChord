name: Auto Build Renamed BitChord

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Check Latest Upstream Tag
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/kushagrasinghx/BitChord/releases/latest | jq -r .tag_name)
          FORK_TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName 2>/dev/null || echo "none")
          echo "Upstream: $UPSTREAM_TAG | Fork: $FORK_TAG"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger via workflow_dispatch: forcing build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          elif [ "$UPSTREAM_TAG" = "$FORK_TAG" ] && [ "$UPSTREAM_TAG" != "null" ]; then
            echo "Up-to-date with upstream. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream version detected ($UPSTREAM_TAG). Commencing build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          fi

      - name: 2. Checkout Upstream Source Code
        if: steps.check_tag.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: kushagrasinghx/BitChord
          ref: ${{ steps.check_tag.outputs.tag }}

      - name: 3. Dynamic Package Renaming & In-App Updater Killer
        if: steps.check_tag.outputs.should_build == 'true'
        run: |
          echo "Patching package name to com.apple.android.music..."
          sed -i -E 's/applicationId(\s*=\s*|\s+)".*"/applicationId = "com.apple.android.music"/' app/build.gradle.kts
          find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*com\.bitchord[^"]*"/package="com.apple.android.music"/g' {} +

          echo "Disabling upstream in-app update checks..."
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i 's|api.github.com/repos/kushagrasinghx/BitChord/releases|localhost/disabled|g' {} +

      - name: 4. Patch AeroPulse Hi-Res Lossless Treble Boost Integration
        if: steps.check_tag.outputs.should_build == 'true'
        run: |
          cat << 'EOF' > patch_aeropulse.py
          import os

          # 1. Patch NerdStats.kt to hold the live AeroPulse preset state
          nerd_file = "shared/src/jvmSharedMain/kotlin/com/music/bitchord/data/NerdStats.kt"
          if os.path.exists(nerd_file):
              with open(nerd_file, "r", encoding="utf-8") as f:
                  content = f.read()
              target = "val current = MutableStateFlow<Snapshot?>(null)"
              replacement = 'val aeroPulsePreset = MutableStateFlow<String?>("Hi-Res Lossless • Treble Air Boost")\n    val current = MutableStateFlow<Snapshot?>(null)'
              if target in content and "aeroPulsePreset" not in content:
                  content = content.replace(target, replacement, 1)
                  with open(nerd_file, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("✓ Patched NerdStats.kt successfully")

          # 2. Patch PlayerControls.kt to display AeroPulse Lossless badge under the seekbar
          pc_file = "sharedUi/src/jvmSharedMain/kotlin/com/music/bitchord/ui/player/PlayerControls.kt"
          if os.path.exists(pc_file):
              with open(pc_file, "r", encoding="utf-8") as f:
                  content = f.read()
              target = "private fun LosslessOrStats(\n    isLoading: Boolean,\n    stillRacing: Boolean,\n    losslessRequested: Boolean,\n    nerdStats: NerdStats.Snapshot?,\n    modifier: Modifier = Modifier,\n) {"
              replacement = target + """
              val aeroPreset by NerdStats.aeroPulsePreset.collectAsStateWithLifecycle()
              if (aeroPreset != null) {
                  LosslessLabel(
                      text = aeroPreset!!,
                      iconPainter = painterResource(Res.drawable.ic_lossless),
                      animated = true,
                      modifier = modifier,
                  )
                  return
              }"""
              if target in content and "aeroPreset" not in content:
                  content = content.replace(target, replacement, 1)
                  with open(pc_file, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("✓ Patched PlayerControls.kt successfully")

          # 3. Patch PlaybackService.kt to receive broadcast events from AeroPulse
          ps_file = "app/src/main/java/com/music/bitchord/playback/PlaybackService.kt"
          if os.path.exists(ps_file):
              with open(ps_file, "r", encoding="utf-8") as f:
                  content = f.read()
              target = "override fun onCreate() {\n        super.onCreate()"
              receiver_code = """override fun onCreate() {
                  super.onCreate()
                  try {
                      val filter = android.content.IntentFilter("com.aeropulse.audio.ACTION_PRESET_CHANGED")
                      val receiver = object : android.content.BroadcastReceiver() {
                          override fun onReceive(ctx: android.content.Context?, intent: android.content.Intent?) {
                              intent?.getStringExtra("quality_label")?.let {
                                  com.music.bitchord.data.NerdStats.aeroPulsePreset.value = it
                              }
                          }
                      }
                      androidx.core.content.ContextCompat.registerReceiver(
                          this, receiver, filter, androidx.core.content.ContextCompat.RECEIVER_EXPORTED
                      )
                  } catch (_: Exception) {}"""
              if target in content and "com.aeropulse.audio.ACTION_PRESET_CHANGED" not in content:
                  content = content.replace(target, receiver_code, 1)
                  with open(ps_file, "w", encoding="utf-8") as f:
                      f.write(content)
                  print("✓ Patched PlaybackService.kt successfully")
          EOF
          python3 patch_aeropulse.py

      - name: 5. Setup Java JDK 17
        if: steps.check_tag.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 6. Setup Release Signing Keystore & Build APKs
        if: steps.check_tag.outputs.should_build == 'true'
        run: |
          echo "Generating signing keystore..."
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias bitchord \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bitchord \
            -keypass bitchord \
            -dname "CN=BitChord, OU=Music, O=BitChord, L=Global, S=Global, C=US"

          cat << 'EOF' > keystore.properties
          storeFile=release.jks
          storePassword=bitchord
          keyAlias=bitchord
          keyPassword=bitchord
          EOF

          chmod +x gradlew
          ./gradlew assembleProdRelease --no-daemon

      - name: 7. Publish GitHub Release
        if: steps.check_tag.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          APKS=$(find app/build/outputs/apk/prod/release -type f -name "*.apk" | tr '\n' ' ')
          echo "Uploading APKs to ${{ github.repository }} for $TAG: $APKS"

          gh release upload "$TAG" $APKS --repo ${{ github.repository }} --clobber || \
          gh release create "$TAG" $APKS \
            --repo ${{ github.repository }} \
            --title "BitChord $TAG (OriginOS)" \
            --notes "Automated build with custom package name (com.apple.android.music) and AeroPulse Hi-Res Lossless integration."
