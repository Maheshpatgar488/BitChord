name: Build & Release BitChord

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias bitchord_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bitchord123 \
            -keypass bitchord123 \
            -dname "CN=BitChord, O=Music, C=US"

      - name: Build Prod Release APK
        run: ./gradlew assembleProdRelease

      - name: Sign ARM64 APK
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          UNSIGNED=$(find app/build/outputs/apk/prod/release -name "*arm64-v8a*.apk" | head -n 1)
          $APKSIGNER sign \
            --ks release.jks \
            --ks-key-alias bitchord_key \
            --ks-pass pass:bitchord123 \
            --key-pass pass:bitchord123 \
            --out BitChord-arm64-signed.apk \
            "$UNSIGNED"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-arm64-signed
          path: BitChord-arm64-signed.apk
