name: Auto Build Renamed BitChord

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if version is up to date'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version_check.outputs.should_build }}
      tag: ${{ steps.version_check.outputs.tag }}
    steps:
      - name: Check Upstream vs Fork Version
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(gh api repos/kushagrasinghx/BitChord/releases/latest --jq .tag_name)
          MY_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name || echo "none")

          echo "Upstream latest tag: $UPSTREAM_TAG"
          echo "Fork latest tag: $MY_TAG"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Manual trigger with force build enabled."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$UPSTREAM_TAG" != "$MY_TAG" ]; then
            echo "New version detected ($UPSTREAM_TAG != $MY_TAG)."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "Already up to date ($MY_TAG). Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Upstream Code
        uses: actions/checkout@v4
        with:
          repository: kushagrasinghx/BitChord
          ref: ${{ needs.check.outputs.tag }}

      - name: Rename Package to Apple Music
        run: |
          sed -i -E 's/applicationId(\s*=\s*|\s+)".*"/applicationId = "com.apple.android.music"/' app/build.gradle.kts
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i 's|api.github.com/repos/kushagrasinghx/BitChord/releases|localhost/disabled|g' {} +
          echo "Verified applicationId modification:"
          grep "applicationId" app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Production Release APK
        run: ./gradlew assembleProdRelease

      - name: Download Uber APK Signer
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign APK
        run: |
          mkdir -p unsigned-apks signed-apks
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} unsigned-apks/ \;
          java -jar uber-apk-signer-1.3.0.jar -a unsigned-apks --out signed-apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: "BitChord ${{ needs.check.outputs.tag }} (OriginOS)"
          files: signed-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
