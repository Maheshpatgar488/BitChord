name: Auto Build Renamed BitChord

on:
  schedule:
    - cron: '0 */2 * * *'  # Checks upstream every 2 hours
  workflow_dispatch:        # Allows manual trigger anytime

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Check Latest Upstream Tag
        id: check_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/kushagrasinghx/BitChord/releases/latest | jq -r .tag_name)
          FORK_TAG=$(gh release view --repo ${{ github.repository }} --json tagName -q .tagName 2>/dev/null || echo "none")
          echo "Upstream: $UPSTREAM_TAG | Fork: $FORK_TAG"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger via workflow_dispatch: forcing build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          elif [ "$UPSTREAM_TAG" = "$FORK_TAG" ] && [ "$UPSTREAM_TAG" != "null" ]; then
            echo "Up-to-date with upstream. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream version detected ($UPSTREAM_TAG). Commencing build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          fi

      - name: 2. Checkout Upstream Source Code
        if: steps.check_tag.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: kushagrasinghx/BitChord
          ref: ${{ steps.check_tag.outputs.tag }}

      - name: 3. Dynamic Package Renaming & In-App Updater Killer
        if: steps.check_tag.outputs.should_build == 'true'
        run: |
          echo "Patching package name to com.soundcloud.android..."
          sed -i -E 's/applicationId(\s*=\s*|\s+)".*"/applicationId = "com.soundcloud.android"/' app/build.gradle.kts

          echo "Disabling upstream in-app update checks..."
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i 's|api.github.com/repos/kushagrasinghx/BitChord/releases|localhost/disabled|g' {} +

      - name: 4. Setup Java JDK 17
        if: steps.check_tag.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 5. Setup Release Signing Keystore & Build APKs
        if: steps.check_tag.outputs.should_build == 'true'
        run: |
          echo "Decoding permanent signing keystore..."
          echo "" | base64 -d > release.jks

          cat << 'EOF' > keystore.properties
          storeFile=release.jks
          storePassword=bitchord
          keyAlias=bitchord
          keyPassword=bitchord
          EOF

          chmod +x gradlew
          ./gradlew assembleProdRelease --no-daemon

      - name: 6. Publish GitHub Release
        if: steps.check_tag.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_tag.outputs.tag }}"
          APKS=$(find app/build/outputs/apk/prod/release -type f -name "*.apk" | tr '\n' ' ')

          echo "Removing obsolete debugSigned assets from $TAG..."
          gh release delete-asset "$TAG" "app-prod-arm64-v8a-release-aligned-debugSigned.apk" --repo ${{ github.repository }} -y 2>/dev/null || true
          gh release delete-asset "$TAG" "app-prod-armeabi-v7a-release-aligned-debugSigned.apk" --repo ${{ github.repository }} -y 2>/dev/null || true
          gh release delete-asset "$TAG" "app-prod-universal-release-aligned-debugSigned.apk" --repo ${{ github.repository }} -y 2>/dev/null || true
          gh release delete-asset "$TAG" "app-prod-x86_64-release-aligned-debugSigned.apk" --repo ${{ github.repository }} -y 2>/dev/null || true

          echo "Uploading clean APKs to ${{ github.repository }} for $TAG: $APKS"
          gh release upload "$TAG" $APKS --repo ${{ github.repository }} --clobber || \
          gh release create "$TAG" $APKS \
            --repo ${{ github.repository }} \
            --title "BitChord $TAG (OriginOS)" \
            --notes "Clean build with custom package name (com.soundcloud.android)."
